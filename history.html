<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Photo</title>

  <!-- Favicon -->
  <link rel="icon" href="Assets/fish-photobooth/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="StyleSheets/history.css" />
</head>

<body>

  <div class="logo">
    <img src="Assets/fish-photobooth/logo-new.png" alt="Logo">
  </div>

  <div class="history-container">
    <div class="history-header">
      <h1>Riwayat Photo Anda</h1>
      <p>Koleksi seluruh foto Anda</p>
    </div>

    <div class="history-grid" id="historyGrid"></div>

    <div class="button-container">
      <button id="backBtn">Kembali</button>
      <button id="contactAdminBtn" class="primary-btn" style="background-color: var(--dark-green-theme); color: white; border: none;">Hubungi Admin</button>
      <button id="clearHistoryBtn" class="danger-btn">Hapus Semua</button>
    </div>

    <!-- Kotak Masuk (Inbox) Section -->
    <div id="inboxSection" class="inbox-container" style="display: none;">
      <h2>Pesan Saya</h2>
      <div id="inboxList" class="inbox-list"></div>
    </div>

  </div>

  <!-- Modal Contact Admin -->
  <div id="contactModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <span id="closeModalBtn" class="close-btn">&times;</span>
      <h2>Kirim Pesan ke Admin</h2>
      <p>Ada masalah dengan foto atau pertanyaan lain?</p>
      <form id="contactForm">
        <textarea id="messageInput" rows="4" placeholder="Tulis pesan Anda di sini..." required></textarea>
        <div class="modal-buttons">
          <button type="submit" id="sendMsgBtn" class="primary-btn" style="background-color: var(--dark-green-theme); color: white; border: none;">Kirim Pesan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

  <!-- History Logic -->
  <script src="Javascripts/history.js"></script>

</body>

</html>
